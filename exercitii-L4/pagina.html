<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagină cu bară laterală</title>
    <link rel="stylesheet" href="css/pagina.css" />
  </head>
  <body>
    <header>
      <h1>Cafeneaua Aroma — Meniu</h1>
    </header>

    <aside>
      <h2>Categorii</h2>
      <a href="#">Cafea</a>
      <a href="#">Ceai</a>
      <a href="#">Desert</a>
    </aside>

    <main>
      <div class="produse">
        <article class="produs">
          <img src="img/espresso.jpg" alt="Espresso" />
          <h3>Espresso</h3>
          <p class="pret">9 lei</p>
        </article>
        <article class="produs">
          <img src="img/flat-white.jpg" alt="Flat white" />
          <h3>Flat white</h3>
          <p class="pret">14 lei</p>
        </article>
        <article class="produs">
          <img src="img/latte.jpg" alt="Latte" />
          <h3>Latte</h3>
          <p class="pret">16 lei</p>
        </article>
        <article class="produs">
          <img src="img/ceai.jpg" alt="Ceai verde" />
          <h3>Ceai verde</h3>
          <p class="pret">10 lei</p>
        </article>
        <article class="produs">
          <img src="img/cheesecake.jpg" alt="Cheesecake" />
          <h3>Cheesecake</h3>
          <p class="pret">18 lei</p>
        </article>
        <article class="produs">
          <img src="img/croissant.jpg" alt="Croissant" />
          <h3>Croissant</h3>
          <p class="pret">8 lei</p>
        </article>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Cafeneaua Aroma</p>
    </footer>
  </body>
</html>
