<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabel de prețuri</title>

    <style>
      table,
      th,
      td {
        border: 1px solid #999;
        border-collapse: collapse;
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Tabel de prețuri</h1>

    <table>
      <caption>
        Prețuri pe mărimi, în lei
      </caption>

      <thead>
        <tr>
          <th scope="col">Băutură</th>
          <th scope="col">Mic</th>
          <th scope="col">Mediu</th>
          <th scope="col">Mare</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <th scope="row">Espresso</th>
          <td>9</td>
          <td>12</td>
          <td>15</td>
        </tr>

        <tr>
          <th scope="row">Cappuccino</th>
          <td>12</td>
          <td>15</td>
          <td>18</td>
        </tr>

        <tr>
          <th scope="row">Latte</th>
          <td>14</td>
          <td>17</td>
          <td>20</td>
        </tr>

        <tr>
          <th scope="row">Ciocolată caldă</th>
          <td>10</td>
          <td>13</td>
          <td>16</td>
        </tr>

        <tr>
          <th scope="row">Ceai</th>
          <td colspan="3">10 lei — o singură mărime</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
