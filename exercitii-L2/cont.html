<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creare cont</title>
  </head>
  <body>
    <h1>Creare cont</h1>

    <form action="#" method="post">
      <p>
        <label for="nume">Nume complet:</label>
        <input type="text" id="nume" name="nume" minlength="3" required />
      </p>

      <p>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required />
      </p>

      <p>
        <label for="parola">Parolă:</label>
        <input
          type="password"
          id="parola"
          name="parola"
          minlength="8"
          required
        />
      </p>

      <p>
        <label for="nastere">Data nașterii:</label>
        <input type="date" id="nastere" name="nastere" />
      </p>

      <p>
        <label for="an">Anul de studiu:</label>
        <select id="an" name="an" required>
          <option value="">— alege —</option>
          <option value="1">Anul I</option>
          <option value="2">Anul II</option>
          <option value="3">Anul III</option>
        </select>
      </p>

      <fieldset>
        <legend>Cum ai aflat de noi?</legend>

        <p>
          <input type="radio" id="google" name="sursa" value="google" />
          <label for="google">Google</label>
        </p>

        <p>
          <input type="radio" id="prieteni" name="sursa" value="prieteni" />
          <label for="prieteni">Prieteni</label>
        </p>

        <p>
          <input type="radio" id="social" name="sursa" value="social-media" />
          <label for="social">Rețele sociale</label>
        </p>
      </fieldset>

      <p>
        <input
          type="checkbox"
          id="termeni"
          name="termeni"
          value="acceptat"
          required
        />
        <label for="termeni"> Accept termenii și condițiile </label>
      </p>

      <p>
        <button type="submit">Creează cont</button>
        <button type="reset">Golește formularul</button>
      </p>
    </form>
  </body>
</html>
